spring.application.name=onboarding-tracker
server.port=8080
server.max-http-request-header-size=16KB

# Embedded H2 (file based)
spring.datasource.url=jdbc:h2:file:./data/onboardingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Properties removed/updated after spring-boot 3.0 migration
#server.max-http-header-size=16KB - replaced with server.max-http-request-header-size
#spring.jpa.hibernate.use-new-id-generator-mappings=true - removed in Boot 3
